<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}.row{display:flex;align-items:center;gap:18px;margin:12px 0}.bar{height:18px;background:var(--accent);border-radius:5px}.label{width:90px;font-size:12px;color:var(--muted)}.card{margin-top:28px;padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}</style></head><body><h1>ALCWARE · Spacing & Radius</h1><div id="list"></div><div class="card"><b>Geometry</b><p>Table action 10px · Controls 12px · Cards 20px · Pills 9999px.</p></div><script>[4,8,12,16,20,24,32,48].forEach(v=>document.getElementById('list').innerHTML+=`<div class="row"><span class="label">${v}px</span><span class="bar" style="width:${v*4}px"></span></div>`)</script></body></html>
