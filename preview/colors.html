<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../tokens.css"><style>body{margin:0;padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}h1{font-size:20px}h2{font-size:14px;margin-top:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.sw{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}.c{height:78px}.t{padding:10px;font-size:12px}.t b,.t span{display:block}.t span{color:var(--muted);margin-top:3px}</style></head><body><h1>ALCWARE · Colors</h1><h2>Primary / Teal</h2><div class="grid" id="p"></div><h2>Neutral</h2><div class="grid" id="n"></div><h2>Semantic & Auxiliary</h2><div class="grid" id="s"></div><script>const add=(id,a)=>document.getElementById(id).innerHTML=a.map(([n,c])=>`<div class="sw"><div class="c" style="background:${c}"></div><div class="t"><b>${n}</b><span>${c}</span></div></div>`).join('');add('p',[['Primary 900','#004F58'],['Primary 800','#006B76'],['Primary 700','#007C88'],['Primary 600','#00909E'],['Primary 500','#1EA4B0'],['Primary 300','#74D5DA'],['Primary 200','#BFECEF'],['Primary 100','#E6F7F9'],['Primary 50','#F3FBFC']]);add('n',[['Neutral 950','#0B181B'],['Neutral 900','#102124'],['Neutral 800','#2D3A3D'],['Neutral 700','#5D7074'],['Neutral 600','#7C8D91'],['Neutral 500','#91A4A8'],['Neutral 400','#C2D2D6'],['Neutral 300','#DDECEE'],['Neutral 200','#EAF3F4'],['Neutral 100','#F4F8F9'],['Neutral 50','#FAFCFC'],['White / Surface','#FFFFFF']]);add('s',[['Success','#43B76C'],['Warning','#D9A441'],['Danger','#E76F61'],['Orange','#F28C45'],['Blue','#4F9BD3'],['Cyan','#58BFD0'],['Violet','#BFA6E8'],['Pink','#E5A5C2']]);</script></body></html>
